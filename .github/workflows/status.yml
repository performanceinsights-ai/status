name: Status

# Probes the service from a GitHub-hosted runner every five minutes and publishes the page
# (status.performanceinsights.ai) with GitHub Pages. Nothing here runs on, or is served by,
# the infrastructure being measured, which is the point of a status page.
on:
  schedule:
    # A fallback only: GitHub ran this about four times a day (website#2913), so the
    # five-minute rounds come from a timer outside GitHub that dispatches this workflow.
    # The page flags data older than 30 minutes.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [probe.py, verify_live.py, deploy_pages.py, components.json, notices.json, "site/**", ".github/workflows/status.yml"]

permissions:
  contents: read

# Rounds queue rather than cancel: each one reads the state the one before it wrote.
concurrency:
  group: status
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write   # the `data` branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # State between rounds (previous results, daily roll-ups, incident log) is one file on a
      # branch that is rewritten as a single commit every round, so it never grows the repository.
      - name: Load the previous state
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" data >/dev/null 2>&1; then
            git fetch --depth=1 --quiet "https://github.com/${GITHUB_REPOSITORY}.git" data
            git show FETCH_HEAD:state.json > data/state.json
          fi

      - name: Probe
        env:
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: python3 probe.py --data data --out public

      # Each round's commit on `data` is a real commit of its own: the Pages build version below (status#6).
      - name: Save the state
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/state-branch"
          mkdir -p "$out"
          cp data/state.json "$out/"
          cd "$out"
          git init -q -b data
          git -c user.name=status-probe -c user.email=status-probe@users.noreply.github.com add state.json
          git -c user.name=status-probe -c user.email=status-probe@users.noreply.github.com commit -q -m "Status state ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assemble the page
        run: cp site/* public/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      # Not actions/deploy-pages: it sends the commit SHA as the build version and the deployment id, and `main` rarely
      # moves, so every round reused one id (status#6). deploy_pages.py makes the same calls under this round's commit
      # on `data`. (The made-up version <sha>-<run id>-<attempt> was answered with 404 on 2026-11-07.)
      - id: deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          PAGES_BUILD_VERSION: ${{ steps.state.outputs.sha }}
        run: python3 deploy_pages.py --artifact-id "$ARTIFACT_ID"

      # "Reported success!" is not proof: on 2026-11-06 every deploy reported it for 19 hours while Pages kept serving
      # the 12:25 build (status#6). Fail the round when the live page is older than the data just built.
      - name: Check the page serves this round
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python3 verify_live.py --built public/status.json --url "${PAGE_URL%/}/status.json"
